version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: fraudshield_postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-fraudshield}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-fraudshield_secret_pass}
      POSTGRES_DB: ${POSTGRES_DB:-fraudshield_db}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-fraudshield} -d ${POSTGRES_DB:-fraudshield_db}"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: fraudshield_redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: fraudshield_backend
    ports:
      - "8000:8000"
    environment:
      - POSTGRES_SERVER=postgres
      - POSTGRES_PORT=5432
      - POSTGRES_USER=${POSTGRES_USER:-fraudshield}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-fraudshield_secret_pass}
      - POSTGRES_DB=${POSTGRES_DB:-fraudshield_db}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - SECRET_KEY=${SECRET_KEY:-change_this_super_secret_jwt_key_in_production}
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./backend:/app
      - ./models_artifacts:/app/models_artifacts

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: fraudshield_frontend
    ports:
      - "3000:80"
    depends_on:
      - backend

volumes:
  postgres_data:
