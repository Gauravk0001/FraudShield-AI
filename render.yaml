services:
  # FraudShield FastAPI Backend Web Service
  - type: web
    name: fraudshield-backend
    env: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: starter
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: PROJECT_NAME
        value: FraudShield AI
      - key: ENVIRONMENT
        value: production
      - key: API_V1_STR
        value: /api/v1
      - key: SECRET_KEY
        generateValue: true
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: 15
      - key: REFRESH_TOKEN_EXPIRE_DAYS
        value: 7
      - key: DATABASE_URL
        fromDatabase:
          name: fraudshield-postgres
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: redis
          name: fraudshield-redis
          property: connectionString
      - key: CORS_ORIGINS
        value: https://fraudshield-ai.vercel.app
      - key: GEMINI_MODEL
        value: gemini-2.0-flash
      - key: RISK_THRESHOLD_MEDIUM
        value: 30
      - key: RISK_THRESHOLD_HIGH
        value: 70

  # FraudShield Managed Redis for Pub/Sub & WebSockets
  - type: redis
    name: fraudshield-redis
    plan: starter
    ipAllowList: [] # internal access only

databases:
  # FraudShield Managed PostgreSQL
  - name: fraudshield-postgres
    plan: starter
    databaseName: fraudshield
    user: fraudshield_user
